<!doctype html>
<meta charset="utf-8">
<title>shot frame</title>
<!--
  Why this exists, and why it looks roundabout.

  Chrome headless clamps its window to a minimum width of about 500px. Ask for
  --window-size=393,850 and the page lays out at 500, but the screenshot is still taken at
  the 393 you asked for, so what comes out is a 500px-wide layout with the right hand side
  cut off. Every phone shot on this site was made that way, and every one of them showed a
  clipped icon grid that does not exist on a real phone.

  So the width is set here instead, on an iframe, in pixels, where nothing clamps it. The
  outer window is kept at or above 500 so the clamp never fires, and the capture is cropped
  back to the iframe afterwards.

  The first attempt scaled the iframe with a CSS transform to get the extra pixels. Do not
  go back to that: Chrome rasterises only part of a transformed iframe, and the bottom third
  of every shot came out black. --force-device-scale-factor on a window that is wide enough
  not to be clamped is the thing that works.

  ?src    what to load, default /
  ?w ?h   the CSS viewport the page should lay out in
  ?open   data-open value to click, same origin only
  ?lock   1 to leave the lock screen up
-->
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
  iframe { display: block; border: 0; }
</style>
<iframe id="f"></iframe>
<script>
  const q = new URLSearchParams(location.search);
  const W = +(q.get('w') || 393);
  const H = +(q.get('h') || 850);

  const f = document.getElementById('f');
  f.style.width = W + 'px';
  f.style.height = H + 'px';

  const wait = ms => new Promise(r => setTimeout(r, ms));

  // Two passes. The first answers the lock screen and the sound gate and then reloads,
  // because both of those record their answer and both animate out. Adding the unlocked
  // class by hand instead left the lock screen's clock and its taunt ghosting through the
  // desktop at low opacity, which is a transition caught halfway rather than a state.
  // After the reload the page comes up the way it does for a visitor who has already
  // answered, with nothing mid-flight.
  let pass = 0;

  f.addEventListener('load', async () => {
    // Cross-origin is expected for the client sites. There is nothing to drive there, the
    // page only has to render, so every reach into the document is guarded rather than
    // branched on origin.
    try {
      const d = f.contentDocument;
      const w = f.contentWindow;
      if (d) {
        if (pass === 0) {
          pass = 1;
          await wait(700);
          const no = d.querySelector('[data-snd="off"]');
          if (no) { no.click(); await wait(700); }
          if (!q.get('lock')) {
            try { w.sessionStorage.u = '1'; } catch (e) {}
          }
          w.location.reload();
          return;
        }
        await wait(900);
        // The unmute notice is a true thing to show a visitor and a distraction in a
        // screenshot, and it has its own dismiss, so use it rather than hiding it.
        const x = d.getElementById('notice-x');
        if (x) { x.checked = true; await wait(400); }

        const open = q.get('open');
        if (open) {
          const el = d.querySelector('[data-open="' + open + '"]');
          if (el) el.click();
          await wait(2500);
        }

        // Lazy images inside the window that just opened have not been asked for yet, so
        // the shot catches empty boxes where the banner and the screenshots belong. Only
        // the ones on screen are promoted, which is what a visitor scrolling would cause
        // anyway.
        const imgs = d.querySelectorAll('img[loading="lazy"]');
        for (const img of imgs) {
          const r = img.getBoundingClientRect();
          if (r.width > 0 && r.top < w.innerHeight * 3) img.loading = 'eager';
        }
        await wait(2500);
      }
    } catch (e) { /* cross origin, nothing to drive */ }
    document.title = 'ready';
  });

  f.src = q.get('src') || '/';
</script>
